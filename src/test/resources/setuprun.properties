############################################
##### CONFIGURAÇÕES DO PROJETO BUGBANK #####
############################################

# BASE URL base da aplicação
BASE_URL=https://bugbank.netlify.app/

############################################
##### GRID URL REMOTO DO SELENIUM GRID #####
############################################

#LOCAL (Navegador do Windows)
GRID_URL=http://localhost:4445/wd/hub

#MESMA NETWORK - Container Jenkins
SAME_NETWORK=http://selenium-hub:4444/wd/hub

#FORA DA NETWORK - Container Jenkins
OUTSIDE_NETWORK=http://host.docker.internal:4444

############################################
####### CONFIGURAÇÃO DO NAVEGADOR ##########
############################################

# Selecionar navegador: chrome | firefox | edge
NAVEGADOR=chrome

# Se os testes devem rodar no Grid (true) ou local (false)
USE_GRID=true

# Executar em modo headless: true | false
HEADLESS=true

# Resolução da janela do navegador (apenas para headless)
# Formato: LARGURAxALTURA
# Exemplos: 1920x1080, 1600x1050, 1280x1024, 1024x768, 800x600, 430x240
# RESOLUÇÃO ATIVA (mude esta chave para alterar a resolução do navegador)
WINDOW_SIZE_ACTIVE=1920x1080